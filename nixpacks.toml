# Railway / Nixpacks build configuration.
# Override the default `npm ci` with `npm install` so the build is robust to
# minor lockfile drift between local (npm 11) and CI (npm 10) — `npm ci` is
# strict, `npm install` is tolerant. Node version comes from package.json's
# engines field (22.x).

[phases.install]
cmds = ["npm install --no-audit --no-fund"]
