# Railway / Nixpacks build configuration.
# Use `npm install` instead of the default `npm ci` because the lockfile in
# this repo was generated with npm 11 and Railway's default builder ships
# npm 10, which can't read the newer lockfile metadata. `npm install` is
# tolerant of the version drift.

[phases.setup]
nixPkgs = ["nodejs_22", "npm-11_x"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
